# ── About Page ──
[about_title]
other = "About Wavecast Radio"

[about_tagline]
other = "Tune in to Tech"

[about_desc]
other = """Wavecast Radio is a live demo built with <a href="https://github.com/adurrr/wavecast" target="_blank" rel="noopener">Wavecast</a>, an open source persistent <strong>&lt;podcast-player&gt;</strong> Web Component for Hugo. Professional program pages, episode listings with chapters and posters, and audio that never stops even as you navigate between pages."""

[about_cta_programs]
other = "Browse Programs"

[about_cta_schedule]
other = "View Schedule"

[about_section_how]
other = "How It Works"

[about_section_how_desc]
other = """The sticky footer player uses <code>data-turbolinks-permanent</code> to survive page navigation. Start an episode, click through to other pages, and the audio keeps playing uninterrupted. The footer syncs bidirectionally with every inline player on the page: pausing one pauses both."""

[about_feature_persistent_desc]
other = "Navigate between pages without restarting. Your audio survives navigation."

[about_feature_sync_desc]
other = "Inline and footer players stay in sync. Pause one, both pause."

[about_feature_chapters_title]
other = "Chapters"

[about_feature_chapters_desc]
other = "Timestamp-labeled navigation within episodes for easy browsing."

[about_feature_sources_title]
