{{- /* Video – wavecast utility shortcode
  Usage: {{< video src="video.mp4" poster="poster.jpg" caption="Video caption" >}}
  HTML5 <video> with optional poster and caption.
*/ -}}
{{- $src := .Get "src" -}}
{{- $poster := .Get "poster" -}}
{{- $caption := .Get "caption" -}}
{{- $width := .Get "width" -}}
{{- $autoplay := .Get "autoplay" | default false -}}
{{- $loop := .Get "loop" | default false -}}
{{- $muted := .Get "muted" | default false -}}
{{- $controls := .Get "controls" | default true -}}

<figure class="wvc-video">
  <video
    {{- if $controls }} controls{{ end -}}
    {{- if $autoplay }} autoplay{{ end -}}
    {{- if $loop }} loop{{ end -}}
    {{- if $muted }} muted{{ end -}}
    {{- with $poster }} poster="{{ . }}"{{ end -}}
    {{- with $width }} width="{{ . }}"{{ end -}}
  >
    <source src="{{ $src }}" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  {{- with $caption -}}
  <figcaption class="wvc-video__caption">{{ . | $.Page.RenderString }}</figcaption>
  {{- end -}}
</figure>
