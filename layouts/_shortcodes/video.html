{{- /* Video – wavecast utility shortcode
  Usage: {{< video src="video.mp4" poster="poster.jpg" caption="Video caption" >}}
  HTML5 <video> with optional poster and caption.
  Autoplay always implies muted (browser requirement).
*/ -}}
{{- $src := .Get "src" -}}
{{- /* Validate video src URL scheme */ -}}
{{- if $src }}
  {{- $scheme := urls.Parse $src }}
  {{- if and $scheme.Scheme (not (or (eq $scheme.Scheme "http") (eq $scheme.Scheme "https"))) }}
    {{- errorf "video: src must use http or https scheme, got %q" $scheme.Scheme }}
  {{- end }}
{{- end -}}
{{- $poster := .Get "poster" -}}
{{- $caption := .Get "caption" -}}
{{- $width := .Get "width" -}}
{{- $autoplay := eq (.Get "autoplay" | default "false") "true" -}}
{{- $loop := eq (.Get "loop" | default "false") "true" -}}
{{- $muted := or $autoplay (eq (.Get "muted" | default "false") "true") -}}
{{- $controls := ne (.Get "controls" | default "true") "false" -}}
{{- /* Auto-detect video type from file extension */ -}}
{{- $vidtype := .Get "type" | default "" -}}
{{- if not $vidtype -}}
  {{- if hasSuffix $src ".webm" }}{{ $vidtype = "video/webm" }}
  {{- else if hasSuffix $src ".ogg" }}{{ $vidtype = "video/ogg" }}
  {{- else }}{{ $vidtype = "video/mp4" }}{{ end -}}
{{- end -}}

<figure class="wvc-video">
  <video
    {{- if $controls }} controls{{ end -}}
    {{- if $autoplay }} autoplay{{ end -}}
    {{- if $loop }} loop{{ end -}}
    {{- if $muted }} muted{{ end -}}
    {{- with $poster }} poster="{{ . }}"{{ end -}}
    {{- with $width }} width="{{ . }}"{{ end -}}
  >
    <source src="{{ $src }}" type="{{ $vidtype }}">
    {{ i18n "video_unsupported" }}
  </video>
  {{- with $caption -}}
  <figcaption class="wvc-video__caption">{{ . | $.Page.RenderString }}</figcaption>
  {{- end -}}
</figure>
