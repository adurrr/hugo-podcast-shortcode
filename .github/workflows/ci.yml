name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hugo-tests:
    name: Hugo Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.146.0"
          extended: true

      - name: Run Hugo integration tests
        run: go test -v -timeout 120s ./tests/hugo/...

  js-tests:
    name: JS Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test

  e2e-tests:
    name: E2E Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.146.0"
          extended: true

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Warm Hugo module cache
        run: hugo --source "${{ github.workspace }}/exampleSite" --quiet 2>/dev/null || true

      - name: Run E2E tests
        run: npx playwright test --config tests/e2e/playwright.config.js --shard=${{ matrix.shard }}/2
