{{- /* _default/single.html - generic single page template */ -}}
{{ define "main" }}
  <article class="content">
    {{ .Content }}
  </article>
  {{- $docsSections := .Site.Params.docs.sections | default (slice "docs") }}
  {{- if in $docsSections .Section }}
    {{- partial "docs-nav.html" . }}
  {{- end }}
{{ end }}
