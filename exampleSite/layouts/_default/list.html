{{ define "main" }}
  {{ .Content }}
  {{- if and (eq .Section "docs") .Pages }}
  <nav class="docs-index" aria-label="Documentation pages">
    <ul class="link-list">
      {{- range .Pages }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Description }} <span class="docs-index-desc">{{ . }}</span>{{ end }}</li>
      {{- end }}
    </ul>
  </nav>
  {{- end }}
{{ end }}
