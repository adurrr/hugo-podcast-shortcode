{{- /* program-card.html - renders a single program card with icon, title, description, episodes */ -}}
{{- $icon := .icon -}}
{{- if not (findRE "<svg\\b" $icon) }}
  {{- errorf "program card: icon must be a valid SVG element, got: %.20s" $icon }}
{{- end -}}
{{- $url  := .url -}}
{{- $title := .title -}}
{{- $desc := .description -}}
{{- $eps  := .episodes | default 0 -}}
<a href="{{ $url }}" class="program-card">
  <div class="program-card-icon">
    {{ $icon | safeHTML }}
  </div>
  <h3>{{ $title }}</h3>
  <p>{{ $desc }}</p>
  <span class="program-card-episodes">{{ i18n "program_card_episodes" (dict "count" $eps) }}</span>
</a>
