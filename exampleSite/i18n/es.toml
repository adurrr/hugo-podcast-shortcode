# ── About Page ──
[about_title]
other = "Acerca de Wavecast Radio"

[about_tagline]
other = "Sintoniza la tecnología"

[about_desc]
other = """Wavecast Radio es una demo en vivo construida con <a href="https://github.com/adurrr/wavecast" target="_blank" rel="noopener">Wavecast</a>, un componente web <strong>&lt;podcast-player&gt;</strong> persistente de código abierto para Hugo. Páginas de programas profesionales, listados de episodios con capítulos y pósters, y audio que nunca se detiene mientras navegas entre páginas."""

[about_cta_programs]
other = "Explorar Programas"

[about_cta_schedule]
other = "Ver Horario"

[about_section_how]
other = "Cómo Funciona"

[about_section_how_desc]
other = """El reproductor persistente del pie de página usa <code>data-turbolinks-permanent</code> para sobrevivir a la navegación. Inicia un episodio, navega a otras páginas y el audio se reproduce sin interrupciones. El pie se sincroniza bidireccionalmente con cada reproductor en línea: pausar uno pausa ambos."""

[about_feature_persistent_desc]
other = "Navega entre páginas sin reiniciar. Tu audio sobrevive la navegación."

[about_feature_sync_desc]
other = "Los reproductores en línea y del pie se mantienen sincronizados. Pausa uno, ambos pausan."

[about_feature_chapters_title]
