baseURL = "https://adurrr.github.io/wavecast/"
title = "Wavecast Radio"
languageCode = "en-us"
ignoreLogs = ["warning-goldmark-raw-html"]
refLinksErrorLevel = "WARNING"
refLinksNotFoundURL = "/"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    contentDir = "content"
    languageName = "English"
    weight = 1
    title = "Wavecast Radio"
    [languages.en.params]
      description = "Wavecast Radio: Tune in to Tech. A demo radio station showcasing the Wavecast persistent podcast-player Web Component for Hugo."

      [languages.en.params.podcast]
        description = "Wavecast Radio brings you the best in tech podcasting, from Infrastructure as Code to open-source culture and modern DevOps practices."
        author = "Wavecast Radio"
        summary  = "A demo podcast showcasing the Hugo Wavecast theme. Each episode features a full persistent audio player, chapter markers, and episode notes — all powered by standard Markdown front matter."
        image    = "/wavecast/logo.png"
        explicit = false
        type     = "episodic"
        owner_name  = "Wavecast Demo"
        owner_email = "demo@wavecast.example"
        language = "en-us"
        copyright = "© 2025 Wavecast Radio"

        [[languages.en.params.podcast.categories]]
          category = "Technology"
        [[languages.en.params.podcast.categories]]
          category = "Leisure"
          subcategory = "Hobbies"

      [languages.en.params.podcastPlayer]
        source = "local"
        persistent = true
        preload = "metadata"

  [languages.es]
    contentDir = "content/es"
    languageName = "Español"
    weight = 2
    title = "Wavecast Radio"
    [languages.es.params]
      description = "Wavecast Radio: Sintoniza la tecnología. Una emisora demo que muestra el componente Wavecast de podcast-player persistente para Hugo."

      [languages.es.params.podcast]
        description = "Wavecast Radio te trae lo mejor del podcasting tecnológico, desde Infraestructura como Código hasta cultura open source y prácticas modernas de DevOps."
        author = "Wavecast Radio"
        summary  = "Un podcast demo que muestra el tema Hugo Wavecast. Cada episodio incluye un reproductor de audio persistente completo, marcadores de capítulos y notas del episodio: todo impulsado por front matter estándar de Markdown."
        image    = "/wavecast/logo.png"
        explicit = false
        type     = "episodic"
        owner_name  = "Wavecast Demo"
        owner_email = "demo@wavecast.example"
        language = "es-es"
        copyright = "© 2025 Wavecast Radio"

        [[languages.es.params.podcast.categories]]
          category = "Technology"
        [[languages.es.params.podcast.categories]]
          category = "Leisure"
          subcategory = "Hobbies"

      [languages.es.params.podcastPlayer]
        source = "local"
        persistent = true
        preload = "metadata"

# Allow raw HTML in Markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Import the local module for development
[module]
  [[module.imports]]
    path = "github.com/adurrr/wavecast"

