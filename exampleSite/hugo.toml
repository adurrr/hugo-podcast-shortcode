baseURL = "https://adurrr.github.io/wavecast/"
title = "Wavecast Radio"
languageCode = "en-us"
ignoreLogs = ["warning-goldmark-raw-html"]

# Allow raw HTML in Markdown
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Import the local module for development
[module]
  [[module.imports]]
    path = "github.com/adurrr/wavecast"

# Site-wide description
[params]
  description = "Wavecast Radio: Tune in to Tech. A demo radio station showcasing the Wavecast persistent podcast-player Web Component for Hugo."

  [params.podcastPlayer]
    source = "local"
    persistent = true
    preload = "metadata"

# Menu configuration for radio station navigation
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "Programs"
    url = "/programs/"
    weight = 20
  [[menu.main]]
    name = "Schedule"
    url = "/schedule/"
    weight = 30
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 40
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 50
