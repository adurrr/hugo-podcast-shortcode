baseURL = "https://adurrr.github.io/hugo-podcast-shortcode/"
title = "Hugo Podcast Shortcode Demo"
languageCode = "en-us"
description = "Live demo for the hugo-podcast-shortcode module — a persistent <podcast-player> Web Component for Hugo"
ignoreLogs = ["warning-goldmark-raw-html"]

# Allow raw HTML in Markdown (used in demo page layout)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Import the local module for development
[module]
  [[module.imports]]
    path = "github.com/adurrr/hugo-podcast-shortcode"

# Site-wide defaults for podcast-player shortcode params.
# Per-shortcode params override these; these override the built-in defaults.
[params]
  [params.podcastPlayer]
    source = "local"
    persistent = true
    preload = "metadata"
