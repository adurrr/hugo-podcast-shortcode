baseURL = "https://adurrr.github.io/wavecast/"
title = "Wavecast Demo"
languageCode = "en-us"
ignoreLogs = ["warning-goldmark-raw-html"]

# Allow raw HTML in Markdown (used in demo page layout)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Import the local module for development
[module]
  [[module.imports]]
    path = "github.com/adurrr/wavecast"

# Site-wide defaults for podcast-player shortcode params.
# Per-shortcode params override these; these override the built-in defaults.
[params]
  description = "Live demo for Wavecast — a persistent <podcast-player> Web Component for Hugo. Works as a module and as a theme."

  [params.podcastPlayer]
    source = "local"
    persistent = true
    preload = "metadata"
