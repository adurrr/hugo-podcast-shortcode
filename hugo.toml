# Wavecast Module
# A Hugo module providing a persistent podcast/radio player Web Component.
# See: https://gohugo.io/hugo-modules/

[module]
  # Module path for Go module resolution
  # Users import via: github.com/adurrr/wavecast
  [module.hugoVersion]
    min = "0.146.0"

[params]
  [params.podcastPlayer]
    # Default audio type
    defaultType = "audio/mpeg"
    # Default preload strategy
    defaultPreload = "metadata"
    # Enable persistence by default
    persistent = true
    # Default source adapter
    defaultSource = "local"
    # Enable playback rate control by default
    showRateControl = true

  # ── RSS / Podcast feed ──
  # To enable an iTunes-compatible podcast RSS feed, add a
  # [params.podcast] section to your SITE's hugo.toml (not here).
  #
  # Fields available (all optional):
  #   description, author, summary, image, copyright, language,
  #   explicit, type ("episodic" or "serial"), owner_name, owner_email
  #
  #   [[params.podcast.categories]]
  #     category = "Technology"
  #     subcategory = "Tech News"  # optional
  #
  # See README for full documentation.
